name: Fix Telegram media release notes

on:
  push:
    branches:
      - telegram-media-release-1

permissions:
  contents: write

jobs:
  edit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          Tested build based on NotificationMirror v1.7.1 source.

          Changes:
          - Telegram MessagingStyle image attachments are extracted from Message.dataUri and mirrored to Wear OS.
          - Picture notifications are rendered with BigPictureStyle on the watch.
          - MessagingStyle is used from the first message for more consistent text handling.

          Confirmed working on Xiaomi Watch 5 + org.telegram.messenger.web.

          This release contains the exact APK artifacts from successful GitHub Actions run #4 (run id 34057988915).
          EOF

          gh release edit v1.7.1-telegram-media.1 --notes-file RELEASE_NOTES.md
