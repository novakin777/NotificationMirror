name: Build MiWear HUN content fix

on:
  push:
    branches:
      - wear-hun-content-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply Telegram media and Wear glance source changes
        run: python3 tools/apply_telegram_media_fix.py

      - name: Apply MiWear HUN content mapping
        run: python3 tools/apply_miwear_hun_fix.py

      - name: Verify source diff
        run: git diff --check

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build phone and watch debug APKs
        run: ./gradlew --stacktrace :mobile:assembleDebug :wear:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: NotificationMirror-Phone-MiWearHunFix
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: NotificationMirror-Watch-MiWearHunFix
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
