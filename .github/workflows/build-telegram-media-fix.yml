name: Build final HUN no-summary

on:
  push:
    branches:
      - wear-hun-final-no-summary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply Telegram media source changes
        run: python3 tools/apply_telegram_media_fix.py

      - name: Apply no-summary HUN fix
        run: python3 tools/apply_hun_no_summary.py

      - name: Verify source diff
        run: git diff --check

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build phone and watch debug APKs
        run: ./gradlew --stacktrace :mobile:assembleDebug :wear:assembleDebug

      - name: Prepare named APKs
        run: |
          mkdir -p release
          cp mobile/build/outputs/apk/debug/mobile-debug.apk release/NotificationMirror-Phone-HUN-NoSummary.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk release/NotificationMirror-Watch-HUN-NoSummary.apk

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: NotificationMirror-Phone-HUN-NoSummary
          path: release/NotificationMirror-Phone-HUN-NoSummary.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: NotificationMirror-Watch-HUN-NoSummary
          path: release/NotificationMirror-Watch-HUN-NoSummary.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.7.1-hun-nosummary.1
        run: |
          cat > release-notes.md <<'EOF'
          ## HUN No Summary

          Xiaomi Watch / Wear OS compatibility variant based on the working Telegram media release `v1.7.1-telegram-media.1`.

          ### Changes since v1.7.1-telegram-media.1
          - Disabled the per-app group-summary notification on the watch side.
          - Only the real mirrored child notification is posted to Wear OS.
          - Prevents MiWearSysUI from creating a second HUN for a newly-created summary StreamItem.
          - Keeps the working Telegram media extraction and transport path from the previous release unchanged.
          - Keeps Telegram photo notifications on the real child `BigPictureStyle` path, which was verified to render directly in Xiaomi HUN.
          - Avoids relying on `setSilent(true)`, `PRIORITY_MIN`, or `GROUP_ALERT_CHILDREN`, because Xiaomi still generated a summary HUN with those flags during testing.

          ### What is different
          This variant completely disables the per-app group-summary notification on the watch. Only the real mirrored child notification is posted.

          On Xiaomi Watch 5 / MiWearSysUI a newly-created group summary can become a second independent StreamItem and trigger its own HUN even when Android flags such as `setSilent(true)`, `PRIORITY_MIN`, or `GROUP_ALERT_CHILDREN` are used. Removing the summary avoids that second HUN entirely.

          ### Expected behavior
          - One HUN per mirrored notification.
          - Text notifications use the real child notification.
          - Telegram photos remain on the proven `BigPictureStyle` child path and can be rendered directly in HUN.
          - No per-app group-summary card is created on the watch.

          ### Install
          Install both APKs from this release: Phone and Watch.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk --clobber
            gh release edit "$TAG" --title "NotificationMirror HUN No Summary" --notes-file release-notes.md
          else
            gh release create "$TAG" release/*.apk --target "$GITHUB_SHA" --title "NotificationMirror HUN No Summary" --notes-file release-notes.md
          fi
